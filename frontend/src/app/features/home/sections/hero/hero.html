<section class="hero section--dark" aria-labelledby="hero-title">
  <div class="container hero__grid">
    <div class="hero__copy">
      <p class="eyebrow">Datos NASA · Colombia</p>
      <h1 id="hero-title">Tu territorio, más claro.</h1>
      <p class="hero__lead">
        Selecciona tu terreno y consulta clima, suelo y cultivos sin crear una cuenta.
      </p>
      <div class="hero__actions">
        <a class="btn btn--light" routerLink="/explorar">Explorar el mapa</a>
        @if (auth.isAuthenticated()) {
          <a class="btn btn--outline-light" routerLink="/fincas">Mis fincas</a>
        } @else {
          <a
            class="btn btn--outline-light"
            routerLink="/registro"
            [queryParams]="{ volver: '/fincas' }"
            >Guardar mi finca</a
          >
        }
      </div>
      <p class="hero__meta">Oriente Antioqueño · Datos con su fuente y fecha</p>
    </div>

    <figure class="hero__figure">
      <svg
        viewBox="0 0 560 470"
        class="hero__svg"
        role="img"
        aria-labelledby="layers-title layers-desc"
      >
        <title id="layers-title">Capas de información integradas</title>
        <desc id="layers-desc">
          Ilustración de una finca vista desde el aire: parcelas con curvas de nivel, montañas al
          fondo y un satélite que observa el terreno.
        </desc>
        <defs>
          <radialGradient id="hero-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#397b57" stop-opacity=".45" />
            <stop offset="1" stop-color="#397b57" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="hero-shadow" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#0b1d17" stop-opacity=".55" />
            <stop offset="1" stop-color="#0b1d17" stop-opacity="0" />
          </radialGradient>
          <pattern
            id="hero-rows-a"
            width="7"
            height="7"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(18)"
          >
            <line
              x1="0"
              y1="0"
              x2="0"
              y2="7"
              stroke="#183d32"
              stroke-opacity=".38"
              stroke-width="2"
            />
          </pattern>
          <pattern
            id="hero-rows-b"
            width="9"
            height="9"
            patternUnits="userSpaceOnUse"
            patternTransform="rotate(-38)"
          >
            <line
              x1="0"
              y1="0"
              x2="0"
              y2="9"
              stroke="#183d32"
              stroke-opacity=".3"
              stroke-width="2"
            />
          </pattern>
          <clipPath id="hero-tile"><rect width="300" height="300" /></clipPath>
        </defs>

        <ellipse cx="280" cy="420" rx="270" ry="34" fill="url(#hero-shadow)" />
        <ellipse cx="300" cy="250" rx="270" ry="210" fill="url(#hero-glow)" />

        <!-- Tile body -->
        <polygon points="20.2,260 280,410 540,282 280,432 20,282" fill="#0f261e" />
        <polygon points="20.2,260 280,410 280,432 20,282" fill="#122e24" />
        <polygon points="280,410 539.8,260 540,280 280,430" fill="#0c1f18" />

        <!-- Ground plane (isometric transform) -->
        <g transform="translate(280 110) matrix(.866 .5 -.866 .5 0 0)">
          <rect width="300" height="300" fill="#24533f" />
          <g
            clip-path="url(#hero-tile)"
            fill="none"
            stroke="#f5f4ec"
            stroke-opacity=".14"
            vector-effect="non-scaling-stroke"
          >
            <ellipse
              cx="190"
              cy="38"
              rx="26"
              ry="16"
              transform="rotate(12 190 38)"
              vector-effect="non-scaling-stroke"
              stroke="#f5f4ec"
            />
            <ellipse
              cx="190"
              cy="38"
              rx="52"
              ry="31"
              transform="rotate(12 190 38)"
              vector-effect="non-scaling-stroke"
              stroke="#f5f4ec"
            />
            <ellipse
              cx="190"
              cy="38"
              rx="82"
              ry="48"
              transform="rotate(12 190 38)"
              vector-effect="non-scaling-stroke"
              stroke="#f5f4ec"
            />
            <ellipse
              cx="190"
              cy="38"
              rx="116"
              ry="66"
              transform="rotate(12 190 38)"
              vector-effect="non-scaling-stroke"
              stroke="#f5f4ec"
            />
            <ellipse
              cx="190"
              cy="38"
              rx="154"
              ry="86"
              transform="rotate(12 190 38)"
              vector-effect="non-scaling-stroke"
              stroke="#f5f4ec"
            />
          </g>

          <path
            d="M30 150C60 120 120 130 140 160C160 190 130 240 90 250C50 258 20 220 30 150Z"
            fill="#397b57"
          />
          <path
            d="M30 150C60 120 120 130 140 160C160 190 130 240 90 250C50 258 20 220 30 150Z"
            fill="url(#hero-rows-a)"
          />
          <path
            d="M152 192C182 172 240 176 260 206C274 236 240 272 200 270C165 268 136 218 152 192Z"
            fill="#a8c686"
          />
          <path
            d="M152 192C182 172 240 176 260 206C274 236 240 272 200 270C165 268 136 218 152 192Z"
            fill="url(#hero-rows-b)"
          />
          <path
            d="M182 102C202 86 242 92 252 116C260 138 237 156 212 152C187 148 172 118 182 102Z"
            fill="#d5a85b"
          />
          <path
            d="M26 72C46 56 92 62 104 86C111 106 84 121 60 116C34 111 18 88 26 72Z"
            fill="#f5f4ec"
            fill-opacity=".1"
            stroke="#f5f4ec"
            stroke-opacity=".5"
            stroke-width="1"
            vector-effect="non-scaling-stroke"
          />
          <path
            d="M0 196C48 214 90 178 140 188S238 168 300 200"
            fill="none"
            stroke="#f5f4ec"
            stroke-opacity=".28"
            stroke-width="1.2"
            stroke-dasharray="5 5"
            vector-effect="non-scaling-stroke"
          />

          <!-- Satellite footprint -->
          <rect x="70" y="125" width="105" height="100" fill="#f5f4ec" fill-opacity=".1" />
          <path
            d="M94 125 L70 125 L70 149 M151 125 L175 125 L175 149 M151 225 L175 225 L175 201 M94 225 L70 225 L70 201"
            fill="none"
            stroke="#f5f4ec"
            stroke-width="1.6"
            stroke-linecap="round"
            vector-effect="non-scaling-stroke"
          />

          <!-- Data marker ring -->
          <circle
            cx="205"
            cy="228"
            r="17"
            fill="none"
            stroke="#d5a85b"
            stroke-width="1.4"
            vector-effect="non-scaling-stroke"
            class="hero__ring"
          />
        </g>

        <!-- Mountains -->
        <polygon points="327,78 287.4,114.6 338.2,154.9" fill="#397b57" />
        <polygon points="327,78 338.2,154.9 376.6,165.4" fill="#2b6249" />
        <polyline
          points="327,78 338.2,154.9"
          fill="none"
          stroke="#a8c686"
          stroke-opacity=".5"
          stroke-width="1"
        />
        <polygon points="397,88 333,147 415,212" fill="#397b57" />
        <polygon points="397,88 415,212 477,229" fill="#2b6249" />
        <polyline
          points="397,88 415,212"
          fill="none"
          stroke="#a8c686"
          stroke-opacity=".5"
          stroke-width="1"
        />
        <polygon points="397,88 381.6,102.2 401.3,117.8" fill="#f5f4ec" />
        <polygon points="397,88 401.3,117.8 416.2,121.8" fill="#d9d8cd" />
        <polygon points="486,182 454,211.5 495,244" fill="#397b57" />
        <polygon points="486,182 495,244 526,252.5" fill="#2b6249" />
        <polyline
          points="486,182 495,244"
          fill="none"
          stroke="#a8c686"
          stroke-opacity=".5"
          stroke-width="1"
        />

        <!-- Observation lines -->
        <g
          stroke="#a8c686"
          stroke-opacity=".75"
          stroke-width="1"
          stroke-dasharray="3 5"
          fill="none"
        >
          <line x1="150" y1="70" x2="145.8" y2="257.5" />
          <line x1="150" y1="70" x2="323.3" y2="260" />
        </g>

        <!-- Satellite -->
        <g transform="translate(150 64) rotate(-18)">
          <g class="hero__sat">
            <rect x="-34" y="-4" width="24" height="9" rx="1" fill="#a8c686" />
            <rect x="10" y="-4" width="24" height="9" rx="1" fill="#a8c686" />
            <path d="M-22 -4V5M-16 -4V5M22 -4V5M28 -4V5" stroke="#183d32" stroke-opacity=".5" />
            <rect x="-9" y="-8" width="18" height="16" rx="3" fill="#f5f4ec" />
            <circle cx="0" cy="0" r="3" fill="#397b57" />
            <path d="M0 -8V-15" stroke="#f5f4ec" stroke-width="1.5" stroke-linecap="round" />
          </g>
        </g>

        <!-- Data marker -->
        <g>
          <line x1="260.1" y1="326.5" x2="260.1" y2="286.5" stroke="#f5f4ec" stroke-opacity=".8" />
          <circle cx="260.1" cy="326.5" r="4" fill="#d5a85b" stroke="#25343a" stroke-width="1.5" />
          <rect
            x="236.1"
            y="264.5"
            width="48"
            height="23"
            rx="11.5"
            fill="#25343a"
            stroke="#f5f4ec"
            stroke-opacity=".25"
          />
          <path
            d="M249.1 281.5V277.5M256.1 281.5V272.5M263.1 281.5V275.5M270.1 281.5V269.5"
            stroke="#a8c686"
            stroke-width="3"
            stroke-linecap="round"
          />
        </g>
      </svg>

      <figcaption class="sr-only">Información de satélite, clima, suelo y finca.</figcaption>
    </figure>
  </div>
</section>
