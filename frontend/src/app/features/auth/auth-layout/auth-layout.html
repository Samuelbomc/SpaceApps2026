<section class="auth">
  <div class="container auth__grid">
    <aside class="auth__brand" aria-label="Sobre la plataforma">
      <img
        class="brand-logo auth__logo"
        src="branding/logo/logo-marfil.svg"
        alt=""
        width="1598"
        height="377"
      />
      <span class="eyebrow sr-only">{{ identity.name }}</span>
      <p class="auth__tagline">Tu finca, en un solo lugar.</p>
      <p>Guarda su ubicación, cultivos y mediciones.</p>
      <p class="auth__region">{{ region }} · Antioquia</p>
    </aside>
    <div class="auth__card card">
      <h1>{{ heading() }}</h1>
      @if (lead()) {
        <p class="auth__lead">{{ lead() }}</p>
      }
      <ng-content />
    </div>
  </div>
</section>
