<section class="section dash">
  <div class="container">
    <header class="dash__head">
      <div>
        <h1>Hola{{ firstName() ? ', ' + firstName() : '' }}</h1>
        <p>Tu finca y tus resultados, en un solo lugar.</p>
      </div>
      <a class="btn btn--primary" routerLink="/explorar">Ubicar mi finca</a>
    </header>
    @if (resume(); as r) {
      <article class="card resume">
        <h2>{{ r.municipality }}</h2>
        <a class="btn btn--secondary" [routerLink]="r.step.path">Continuar</a>
      </article>
    }
    <div class="dash__grid">
      <article class="card panel" aria-labelledby="farms-title">
        <h2 id="farms-title">Mis fincas</h2>
        <p>Ubicación, cultivos y mediciones.</p>
        <a class="btn btn--secondary" routerLink="/fincas">Abrir mis fincas</a>
      </article>
      <article class="card panel" aria-labelledby="results-title">
        <h2 id="results-title">Resultados</h2>
        <p>Clima, suelo y opciones de cultivo.</p>
        <a class="btn btn--secondary" routerLink="/explorar" fragment="resultados"
          >Ver resultados</a
        >
      </article>
    </div>
  </div>
</section>
