<button
  #trigger
  type="button"
  class="dropdown__trigger"
  [class.dropdown__trigger--open]="open()"
  aria-haspopup="true"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="menuId"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  {{ group().label }}
  <span class="dropdown__caret" aria-hidden="true"></span>
</button>

<ul [id]="menuId" class="dropdown__menu" [class.dropdown__menu--open]="open()" (keydown)="onMenuKeydown($event)">
  @for (link of group().links; track link.label) {
    <li>
      <a class="dropdown__link" [routerLink]="link.path" [fragment]="link.fragment" (click)="choose()">{{ link.label }}</a>
    </li>
  }
</ul>
