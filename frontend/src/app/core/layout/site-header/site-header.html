<header class="header" [class.header--open]="menuOpen()">
  <div class="container header__bar">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <img
        class="brand-logo brand__logo"
        src="branding/logo/logo-vegetacion-grafito.svg"
        alt=""
        width="1598"
        height="377"
      />
      <span class="brand__text">
        <span class="brand__name sr-only">{{ identity.name }}</span>
        <span class="brand__tag">NASA Space Apps · Colombia</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="primary-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="menu-toggle__icon" aria-hidden="true"></span>
      <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
    </button>

    <nav id="primary-nav" class="nav" aria-label="Navegación principal">
      <ul class="nav__list">
        @for (item of navItems(); track item.label) {
          <li>
            @if (item.kind === 'group') {
              <app-nav-dropdown [group]="item" (navigated)="closeMenu()" />
            } @else {
              <a
                class="nav__link"
                [routerLink]="item.path"
                [fragment]="item.fragment"
                routerLinkActive="nav__link--active"
                [routerLinkActiveOptions]="activeOptions"
                ariaCurrentWhenActive="page"
                (click)="closeMenu()"
                >{{ item.label }}</a
              >
            }
          </li>
        }
      </ul>

      <div class="account">
        @if (auth.user(); as user) {
          <a
            class="account__user"
            routerLink="/perfil"
            routerLinkActive="account__user--active"
            ariaCurrentWhenActive="page"
            (click)="closeMenu()"
          >
            <span class="avatar" aria-hidden="true">{{ initials() }}</span>
            <span class="account__name">{{ user.name }}</span>
          </a>
          <button type="button" class="btn btn--secondary account__btn" (click)="logout()">
            Cerrar sesión
          </button>
        } @else {
          <a class="nav__link" routerLink="/acceso" (click)="closeMenu()">Iniciar sesión</a>
          <a class="btn btn--primary account__btn" routerLink="/registro" (click)="closeMenu()"
            >Crear cuenta</a
          >
        }
      </div>
    </nav>
  </div>
</header>
