<header class="header" [class.header--open]="menuOpen()">
  <div class="container header__bar">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <app-brand-mark />
      <span class="brand__text">
        <span class="brand__name">{{ identity.name }}</span>
        <span class="brand__tag">Prototipo · Piloto Antioquia</span>
      </span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="primary-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span class="menu-toggle__icon" aria-hidden="true"></span>
      <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
    </button>

    <nav id="primary-nav" class="nav" aria-label="Navegación principal">
      <ul class="nav__list">
        @for (item of navItems; track item.label) {
          <li>
            <a
              class="nav__link"
              [routerLink]="item.path"
              [fragment]="item.fragment"
              routerLinkActive="nav__link--active"
              [routerLinkActiveOptions]="activeOptions"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>
