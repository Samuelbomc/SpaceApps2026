[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift"
version = "0.1.0"
description = "Clientes de ingesta NASA para el Oriente antioqueño"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
download = ["earthaccess>=0.15,<1"]
storage = ["pyarrow>=20,<30"]
geospatial = ["geographiclib>=2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "argon2-cffi>=25,<26", "python-multipart>=0.0.20,<1", "email-validator>=2,<3"]
test = ["httpx>=0.27,<1", "pymongo>=4.14,<5"]
local = ["embedded-postgres>=18.6,<19"]
mongo = ["pymongo>=4.14,<5"]
ml = ["xgboost>=3.1,<4", "numpy>=2,<3", "pandas>=2.2,<4"]

[project.scripts]
spaceapps-ingest = "scripts.ingest:main"
field-shift-ingest = "scripts.ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps", "apps.api*", "pipelines*", "packages*", "scripts*", "ml*"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"packages.contracts" = ["*.schema.json", "openapi.json", "*.ts"]
"ml.configs" = ["*.json"]
