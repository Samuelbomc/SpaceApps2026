[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrogeo"
version = "0.1.0"
description = "AgroGeo: observación terrestre y análisis agroclimático para decisiones agrícolas"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
download = ["earthaccess>=0.15,<1"]
processing = ["h5py>=3.12,<4", "rasterio>=1.4,<2"]
storage = ["pyarrow>=20,<30"]
geospatial = ["geographiclib>=2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "argon2-cffi>=25,<26", "python-multipart>=0.0.20,<1", "email-validator>=2,<3"]
test = ["httpx>=0.27,<1", "pymongo>=4.14,<5"]
local = ["embedded-postgres>=18.6,<19"]
mongo = ["pymongo>=4.14,<5"]
ml = ["xgboost>=3.1,<4", "numpy>=2,<3", "pandas>=2.2,<4"]
dev = ["ruff==0.17.5"]

[project.scripts]
agrogeo-ingest = "scripts.ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps", "apps.api*", "pipelines*", "packages*", "scripts*", "ml*", "modulo_rotacion"]
exclude = ["*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"packages.contracts" = ["*.schema.json", "openapi.json", "*.ts"]
"ml.configs" = ["*.json"]
"modulo_rotacion" = ["datos/cultivos.csv"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "tools", ".venv-data", "frontend/node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
