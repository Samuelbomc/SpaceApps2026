  "services": {
    "api": {
      "build": {
        "context": ".",
        "dockerfile": "infra/docker/api.Dockerfile"
      },
      "command": null,
      "depends_on": {
        "mongo": {
          "condition": "service_healthy",
          "required": true
        },
        "postgres": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "entrypoint": null,
      "environment": {
        "AUTH_COOKIE_SECURE": "true",
        "CORS_ORIGINS": "${CORS_ORIGINS:?Set CORS_ORIGINS}",
        "DATABASE_URL": "postgresql://fieldshift:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/fieldshift",
        "DATASET_DIRECTORY": "/app/data/datasets",
        "FARM_UPLOAD_DIRECTORY": "/app/data/farms",
        "FEATURE_DIRECTORY": "/app/data/features/daily-direct-v1",
        "GEOCODER_URL": "https://photon.komoot.io/reverse",
        "INGESTION_LAG_DAYS": "3",
        "MODEL_DIRECTORY": "/app/data/models",
        "MODEL_DOWNLOAD_MAX_MB": "128",
        "MODEL_SOURCE_DIRECTORY": "/app/data",
        "MONGODB_DATABASE": "fieldshift",
        "MONGODB_URI": "mongodb://mongo:27017",
        "NEAREST_INPUT_MAX_DISTANCE_KM": "200",
        "PRETRAINED_MODEL_DIRECTORY": "/app/ml/artifacts",
        "RECENT_OBSERVATION_DAYS": "90",
        "REGION_ID": "antioquia-reference",
        "REGION_LATITUDE": "6.2442",
        "REGION_LONGITUDE": "-75.5812",
        "REGION_NAME": "Medell\u00edn \u00b7 referencia t\u00e9cnica",
        "RESULTS_BACKEND": "mongodb",
        "ROTATION_WATER_RULES_PATH": "",
        "SOURCE_FALLBACK_MAX_LAG_DAYS": "5",
        "TRAINING_CONFIG_PATH": "",
        "TRAINING_DATA_DIRECTORY": "/app/data/prepared/daily"
      },
      "networks": {
        "default": null
      },
      "restart": "unless-stopped",
      "volumes": [
        {
          "type": "bind",
          "source": "./data",
          "target": "/app/data",
          "bind": {}
        }
      ],
      "image": "agrogeo-migration-api:4ea618d",
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"
        ],
        "interval": "10s",
        "timeout": "6s",
        "retries": 20,
        "start_period": "30s"
      }
    },
