    "mongo": {
      "command": null,
      "entrypoint": null,
      "healthcheck": {
        "test": [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ],
        "timeout": "5s",
        "interval": "5s",
        "retries": 20
      },
      "image": "mongo:8.0",
      "networks": {
        "default": null
      },
      "restart": "unless-stopped",
      "volumes": [
        {
          "type": "volume",
          "source": "mongo_data",
          "target": "/data/db",
          "volume": {}
        }
      ]
    },
    "postgres": {
      "command": null,
      "entrypoint": null,
      "environment": {
        "POSTGRES_DB": "fieldshift",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}",
        "POSTGRES_USER": "fieldshift"
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ],
        "timeout": "3s",
        "interval": "5s",
        "retries": 20
      },
      "image": "postgres:17-alpine",
      "networks": {
        "default": null
      },
      "restart": "unless-stopped",
      "volumes": [
        {
          "type": "volume",
          "source": "postgres_data",
          "target": "/var/lib/postgresql/data",
          "volume": {}
        }
      ]
