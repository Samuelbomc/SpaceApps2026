# Incluir dentro del server de Nginx que sirve el frontend nuevo.
# Las variables de Origin y las cookies se conservan para la validación CSRF.
location /backend/ {
    client_max_body_size 6m;
    proxy_pass http://api:8000/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}
