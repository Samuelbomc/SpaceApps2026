server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/frontend-api.conf;
    # Module workers require a JavaScript MIME type even when nginx does not
    # include .mjs in its default mime.types. Missing assets must not return SPA HTML.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        # Worker headers must be revalidated after hosting/MIME corrections.
        expires -1;
        try_files $uri =404;
    }
    location /geo/ {
        types {
            application/geo+json geojson;
            application/json json;
        }
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
